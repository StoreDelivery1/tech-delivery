services:
  postgres:
    image: postgres:16
    container_name: tech-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-tech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: