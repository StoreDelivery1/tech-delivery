services:
  postgres:
    image: postgres:16
    container_name: tech-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tech_delivery
      POSTGRES_USER: tech_user
      POSTGRES_PASSWORD: tech_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: